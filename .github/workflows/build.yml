name: Build BOK-coin

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake pkg-config libboost-all-dev \
            libssl-dev libunbound-dev libzmq3-dev libsodium-dev \
            libreadline-dev libldns-dev libexpat1-dev libpgm-dev \
            libnorm-dev libgtest-dev libpcsclite-dev libhidapi-dev \
            libusb-1.0-0-dev libudev-dev

      - name: Build static release
        run: |
          make release-static-linux-x86_64 -j$(nproc)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/release/bin/* dist/
          cd dist && tar -czvf ../bokcoin-linux-x86_64.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bokcoin-linux-x86_64
          path: bokcoin-linux-x86_64.tar.gz

  macos:
    name: Build macOS x86_64
    runs-on: macos-15-intel # Intel runner for x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake boost openssl@3 zmq libsodium unbound hidapi libusb

      - name: Build static release
        env:
          OPENSSL_ROOT_DIR: /usr/local/opt/openssl@3
        run: |
          make release-static-mac-x86_64 -j$(sysctl -n hw.ncpu)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/release/bin/* dist/
          cd dist && tar -czvf ../bokcoin-macos-x86_64.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bokcoin-macos-x86_64
          path: bokcoin-macos-x86_64.tar.gz

  macos-arm64:
    name: Build macOS ARM64 (Sequoia)
    runs-on: macos-15 # macOS 15 Sequoia, Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake boost openssl@3 zmq libsodium unbound hidapi libusb

      - name: Build
        env:
          OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
        run: |
          mkdir -p build/release
          cd build/release
          cmake -D STATIC=ON -D ARCH="armv8-a" -D BUILD_64=ON \
                -D CMAKE_BUILD_TYPE=Release -D BUILD_TAG="mac-arm64" ../..
          make -j$(sysctl -n hw.ncpu)

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/release/bin/* dist/
          cd dist && tar -czvf ../bokcoin-macos-arm64.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bokcoin-macos-arm64
          path: bokcoin-macos-arm64.tar.gz

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            git
            make

      - name: Set up posix threading
        run: |
          # Ensure posix threading is used (required for std::thread)
          echo "Using MINGW64 with posix threading"

      - name: Build static release
        run: |
          make release-static-win64 -j$(nproc)

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/release/bin/*.exe dist/
          Compress-Archive -Path dist/* -DestinationPath bokcoin-windows-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bokcoin-windows-x64
          path: bokcoin-windows-x64.zip

  # Optional: Create GitHub Release when a tag is pushed
  release:
    name: Create Release
    needs: [linux, macos, macos-arm64, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/bokcoin-linux-x86_64/bokcoin-linux-x86_64.tar.gz
            artifacts/bokcoin-macos-x86_64/bokcoin-macos-x86_64.tar.gz
            artifacts/bokcoin-macos-arm64/bokcoin-macos-arm64.tar.gz
            artifacts/bokcoin-windows-x64/bokcoin-windows-x64.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
